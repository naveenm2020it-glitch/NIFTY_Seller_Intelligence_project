name: Phase 1 - Official NSE connectivity probe

on:
  push:
    branches:
      - phase1-nse-data-acquisition-env
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe official source connectivity
        run: python tools/nse_connectivity_probe.py
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: nse-connectivity-report
          path: artifacts/connectivity-report.json
          if-no-files-found: error
          retention-days: 14
