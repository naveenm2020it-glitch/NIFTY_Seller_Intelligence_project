name: NIFTY Seller Intelligence Backend, Frontend and Phase 1 Archive CI

on:
  push:
    branches:
      - phase-0-foundation
      - phase-1-data-audit
      - phase-2-user-config-orchestration
      - phase-3-storage-data-processing
      - main
  pull_request:
    branches:
      - main
      - phase-2-user-config-orchestration
      - phase-3-storage-data-processing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nifty_seller_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nifty_seller_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nifty_seller_intelligence
      DATA_STORAGE_PATH: ${{ github.workspace }}/local_data
      PHASE2_REAL_ARCHIVE_SMOKE: "1"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nifty_seller_intelligence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify the preserved Phase 1 archive from B2
        env:
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          PHASE1_ARTIFACT_DIR: ${{ github.workspace }}/local_data
        run: |
          python ../tools/download_phase1_archive_from_b2.py
          cd "$GITHUB_WORKSPACE"
          PHASE1_ARTIFACT_DIR="$GITHUB_WORKSPACE/local_data" python -c "from tools.upload_phase1_archive_to_b2 import verify_source_artifact; verify_source_artifact()"
          mkdir -p "$GITHUB_WORKSPACE/local_data/artifacts"
          mv "$GITHUB_WORKSPACE/local_data/manifests" "$GITHUB_WORKSPACE/local_data/artifacts/manifests"
          mv "$GITHUB_WORKSPACE/local_data/raw" "$GITHUB_WORKSPACE/local_data/artifacts/raw"
          test -f "$GITHUB_WORKSPACE/local_data/artifacts/manifests/fo-download-manifest.json"
          test -f "$GITHUB_WORKSPACE/local_data/artifacts/manifests/nifty50-download-manifest.json"
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run backend tests including real archive and PostgreSQL smoke test
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
