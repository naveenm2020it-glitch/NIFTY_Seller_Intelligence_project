name: Phase 1 - NIFTY EOD archive acquisition and audit # corrected parser and MII identity validation

on:
  workflow_dispatch:
    inputs:
      include_muhurat:
        description: "Attempt 8-Nov-2026 Muhurat session"
        required: true
        type: choice
        options:
          - auto
          - yes
          - no
        default: auto

permissions:
  contents: read

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 1 acquisition branch
        uses: actions/checkout@v4
        with:
          ref: phase1-nse-data-acquisition-env
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install downloader dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download official NSE archives and audit NIFTY rows
        env:
          INCLUDE_MUHURAT: ${{ inputs.include_muhurat || 'auto' }}
        run: python tools/download_nifty_eod_archives.py
      - name: Upload source archives, manifest and audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty-eod-phase1-${{ github.run_number }}
          path: artifacts/nse-phase1/
          if-no-files-found: warn
          retention-days: 30
