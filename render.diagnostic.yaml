databases:
  - name: nifty-predictor-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: nifty_predictor_db
    user: nifty_predictor_db_user
    ipAllowList: []

services:
  - type: cron
    name: nifty-seller-intelligence-readonly-db-audit
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/render_db_audit.py
    schedule: "0 0 1 1 *"
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nifty-predictor-db
          property: connectionString
